<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Verktyg — Norrköpingskartan</title>
    <meta
      name="description"
      content="Mät sträckor och ytor, läs koordinater i SWEREF 99 TM, rita och exportera GeoJSON, skriv ut och dela kartvyer över Norrköpings kommun. Byggt med Origo och OpenLayers."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Origo laddas bara här, aldrig på landningsvyn (TK-05). Preload startar hämtningen parallellt med vår egen kod. -->
    <link rel="preload" href="/vendor/origo-2.10.0/js/origo.min.js" as="script" />
    <link rel="stylesheet" href="/vendor/origo-2.10.0/css/style.css" />
    <script type="module" src="/src/verktyg/main.ts"></script>
  </head>
  <body class="verktyg">
    <a class="skip-link" href="#app-wrapper" data-i18n="a11y.skipToMap">Hoppa till kartan</a>

    <header class="topbar">
      <a class="brand" href="%BASE_URL%" data-i18n="site.name">Norrköpingskartan</a>
      <nav class="topnav" aria-label="Huvudmeny" data-i18n-aria="nav.label">
        <a href="%BASE_URL%" data-i18n="verktyg.backToMap">Till kartan</a>
        <span class="topnav__current" aria-current="page" data-i18n="nav.tools">Verktyg</span>
      </nav>
    </header>

    <p id="verktyg-status" class="map-status" role="status" aria-live="polite" hidden></p>

    <div
      id="app-wrapper"
      role="application"
      aria-label="Verktygsläge: mät, rita, läs koordinater, skriv ut och dela kartan över Norrköpings kommun."
      data-i18n-aria="verktyg.ariaLabel"
    ></div>

    <footer class="footer">
      <p class="footer__disclaimer">
        <span lang="sv">Ett oberoende projekt av Aren Mardian. Inte en officiell tjänst från Norrköpings kommun.</span>
        <span lang="en">An independent project by Aren Mardian. Not an official service of Norrköping Municipality.</span>
      </p>
    </footer>
  </body>
</html>
