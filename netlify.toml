# Norrköpingskartan — Netlify-konfiguration
# Speglar deploy-kedjan för arenm.se (Vite + statisk hosting + Netlify Functions).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# ── Sökvägar ─────────────────────────────────────────────────────────────────
# Sajtens rot är /projekt/norrkoping/ (kravspec §9.1). Rotanrop på Netlify-domänen
# skickas dit. På arenm.se proxas /projekt/norrkoping/* hit från portfolio-sajten.
[[redirects]]
  from = "/"
  to = "/projekt/norrkoping/"
  status = 301

# Verktygssidan använder relativa sökvägar (../vendor, ../data) och kräver avslutande snedstreck.
[[redirects]]
  from = "/projekt/norrkoping/verktyg"
  to = "/projekt/norrkoping/verktyg/"
  status = 301

# Saknad datafil ska ge 404, inte index.html (annars försöker PMTiles-läsaren tolka HTML).
[[redirects]]
  from = "/projekt/norrkoping/data/*"
  to = "/projekt/norrkoping/404.html"
  status = 404

[[redirects]]
  from = "/projekt/norrkoping/vendor/*"
  to = "/projekt/norrkoping/404.html"
  status = 404

# SPA-fallback tills per-objekt-sidor förrenderas (NFK-32). Funktioner under /api
# definierar sina egna sökvägar och matchas före denna regel.
[[redirects]]
  from = "/projekt/norrkoping/*"
  to = "/projekt/norrkoping/index.html"
  status = 200

# ── Headers ──────────────────────────────────────────────────────────────────
# Netlify: när flera regler matchar samma sökväg vinner den SISTA regeln för ett givet
# header-namn. Därför ligger de generella reglerna först och de specifika efter.

# Säkerhet (NFK-16, NFK-17) — gäller allt.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# Dokument valideras alltid mot ETag (NFK-04).
[[headers]]
  for = "/projekt/norrkoping/*"
  [headers.values]
    Cache-Control = "no-cache"

# Vite ger innehållshashade filnamn under /assets/ → kan cachas för alltid.
[[headers]]
  for = "/projekt/norrkoping/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vendorerade bibliotek ligger under versionerad sökväg (vendor/origo-2.10.0/…) → cachas länge.
[[headers]]
  for = "/projekt/norrkoping/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Härledda geodatafiler (PMTiles, GeoJSON — ADR-09/ADR-10). PMTiles läses med Range-requests;
# ETag avslöjar ny version.
[[headers]]
  for = "/projekt/norrkoping/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Accept-Ranges = "bytes"

# Verktygsläget (ADR-11): Origo bygger sina paneler med style-attribut (kräver 'unsafe-inline'
# för style-src) och sätter alltid ett <base>-element (kräver base-uri 'self'). Bara på den här
# sidan; script-src förblir strikt.
[[headers]]
  for = "/projekt/norrkoping/verktyg/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
