# Norrköpingskartan — Netlify-konfiguration
# Speglar deploy-kedjan för arenm.se (Vite + statisk hosting + Netlify Functions).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# ── Sökvägar ─────────────────────────────────────────────────────────────────
# Sajtens rot är /projekt/norrkoping/ (kravspec §9.1). Rotanrop på Netlify-domänen
# skickas dit. På arenm.se proxas /projekt/norrkoping/* hit från portfolio-sajten.
[[redirects]]
  from = "/"
  to = "/projekt/norrkoping/"
  status = 301

# Origo-sidan använder relativa sökvägar (../vendor, ../data) och kräver avslutande snedstreck.
[[redirects]]
  from = "/projekt/norrkoping/origo"
  to = "/projekt/norrkoping/origo/"
  status = 301

# Sidan hette /verktyg/ till 2026-09-20 (ADR-11) — gamla länkar och bokmärken ska fortsätta fungera.
[[redirects]]
  from = "/projekt/norrkoping/verktyg"
  to = "/projekt/norrkoping/origo/"
  status = 301

[[redirects]]
  from = "/projekt/norrkoping/verktyg/*"
  to = "/projekt/norrkoping/origo/:splat"
  status = 301

# Saknad datafil ska ge 404, inte index.html (annars försöker PMTiles-läsaren tolka HTML).
[[redirects]]
  from = "/projekt/norrkoping/data/*"
  to = "/projekt/norrkoping/404.html"
  status = 404

[[redirects]]
  from = "/projekt/norrkoping/vendor/*"
  to = "/projekt/norrkoping/404.html"
  status = 404

# Språkprefix (/sv/, /en/ — FK-34) leder till landningsvyn; i18n läser segmentet ur URL:en.
[[redirects]]
  from = "/projekt/norrkoping/sv/*"
  to = "/projekt/norrkoping/index.html"
  status = 200

[[redirects]]
  from = "/projekt/norrkoping/en/*"
  to = "/projekt/norrkoping/index.html"
  status = 200

# Allt annat som saknas är ett riktigt 404 — inte landningsvyn under fel adress. Om projektet,
# källor och integritet ligger på arenm.se; sajten har inga egna sidor utöver / och /origo/.
# Funktioner under /api definierar sina egna sökvägar och matchas före denna regel.
[[redirects]]
  from = "/projekt/norrkoping/*"
  to = "/projekt/norrkoping/404.html"
  status = 404

# ── Headers ──────────────────────────────────────────────────────────────────
# Netlify: när flera regler sätter samma header för en sökväg är resultatet inte
# förutsägbart (verifierat 2026-09-20: en generell Cache-Control-regel slog ut de specifika
# oavsett ordning). Därför sätter bara EN regel per header och sökväg Cache-Control.
# HTML-dokument får Netlifys standard "public, max-age=0, must-revalidate" + ETag (NFK-04).

# Säkerhet (NFK-16, NFK-17) — gäller allt. Själva CSP:n ligger som <meta http-equiv> i varje
# HTML-sida (strikt på landningsvyn, relaxad style-src/base-uri bara på /origo/), eftersom Netlify
# inte tillåter olika värden per sökväg på ett förutsägbart sätt. Headern bär bara det som meta
# inte kan uttrycka: frame-ancestors.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# Vite ger innehållshashade filnamn under /assets/ → kan cachas för alltid.
[[headers]]
  for = "/projekt/norrkoping/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vendorerade bibliotek ligger under versionerad sökväg (vendor/origo-2.10.0/…) → cachas länge.
[[headers]]
  for = "/projekt/norrkoping/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Geodata (PMTiles, GeoJSON — ADR-09/ADR-10). PMTiles läses med Range-requests; ETag avslöjar ny
# version. Badplatsernas grunddata ligger också här; den dynamiska statusen går via /api.
[[headers]]
  for = "/projekt/norrkoping/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Accept-Ranges = "bytes"

