# Norrköpingskartan — Netlify-konfiguration.
#
# Bara det som Netlify måste läsa INNAN bygget startar ligger här. Omdirigeringar och headers
# ligger i netlify/rules.ts och skrivs som `_redirects` och `_headers` i publiceringsmappen
# vid bygget (ADR-17) — de följer då med som filer i deployen och kan inte bli gamla på vägen.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# ── Headers ──────────────────────────────────────────────────────────────────
# Dessa speglar `headers` i netlify/rules.ts, som också skriver dem till `_headers`
# i publiceringsroten (ADR-17). Dubbleringen är avsiktlig och tillfällig:
#
# I drift 2026-09-24 svarade sajten med headers som är byte-identiska med den här
# filens ALLRA FÖRSTA version — `Cache-Control: no-cache` även på innehållshashade
# filer, och en fullständig CSP med `style-src 'self'` som i snitt med sidans egen
# meta-CSP blockerar Origos inline-stilar (403 konsolfel i verktygsläget).
# Omdirigeringarna från `_redirects` slog däremot igenom. Netlify låter netlify.toml
# vinna över `_headers` vid konflikt, så om den här filen läses vinner rätt värden.
#
# `X-Config-Source` är en diagnostikmarkör: syns den i svaret läses den här filen,
# och då är felet löst. Syns den inte är konfigurationen fastfrusen och sajten
# behöver "Clear cache and deploy" eller skapas om. Ta bort markören när svaret är känt.
#
# netlify/rules.test.ts kontrollerar att de två uppsättningarna inte glider isär.

[[headers]]
  for = "/*"
  [headers.values]
    X-Config-Source = "toml-2026-09-24"
    Content-Security-Policy = "frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# Vite ger innehållshashade filnamn → kan cachas för alltid (NFK-04).
[[headers]]
  for = "/projekt/norrkoping/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vendorerade bibliotek ligger under versionerad sökväg (vendor/origo-2.10.0/…).
[[headers]]
  for = "/projekt/norrkoping/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Geodata (PMTiles, GeoJSON, sökindex). PMTiles läses med Range-requests; ETag avslöjar ny version.
# Ingen bred `/projekt/norrkoping/*`-regel här: en sådan vann tidigare över assets-regeln ovan
# och gjorde `no-cache` av allt.
[[headers]]
  for = "/projekt/norrkoping/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Accept-Ranges = "bytes"
