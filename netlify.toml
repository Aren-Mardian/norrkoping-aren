# Norrköpingskartan — Netlify-konfiguration
# Speglar deploy-kedjan för arenm.se (Vite + statisk hosting + Netlify Functions).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# ── Sökvägar ─────────────────────────────────────────────────────────────────
# Sajtens rot är /projekt/norrkoping/ (kravspec §9.1). Rotanrop på Netlify-domänen
# skickas dit. På arenm.se proxas /projekt/norrkoping/* hit från portfolio-sajten.
[[redirects]]
  from = "/"
  to = "/projekt/norrkoping/"
  status = 301

# SPA-fallback tills per-objekt-sidor förrenderas (NFK-32). Funktioner under /api
# definierar sina egna sökvägar och matchas före denna regel.
[[redirects]]
  from = "/projekt/norrkoping/*"
  to = "/projekt/norrkoping/index.html"
  status = 200

# ── Cache (NFK-04) ───────────────────────────────────────────────────────────
# Vite ger innehållshashade filnamn under /assets/ → kan cachas för alltid.
[[headers]]
  for = "/projekt/norrkoping/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dokument valideras alltid mot ETag.
[[headers]]
  for = "/projekt/norrkoping/*"
  [headers.values]
    Cache-Control = "no-cache"

# ── Säkerhet (NFK-16, NFK-17) ────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
